<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="foldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D946EF"/>
      <stop offset="55%" stop-color="#DF58BF"/>
      <stop offset="100%" stop-color="#F0902F"/>
